    <radialGradient id="plaFade" gradientUnits="userSpaceOnUse" cx="200" cy="210" r="230">
      <stop offset="0" stop-color="#fff"/>
      <stop offset=".55" stop-color="#fff" stop-opacity=".8"/>
      <stop offset=".86" stop-color="#fff" stop-opacity=".26"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <g stroke="url(#plaFade)" stroke-linecap="round" stroke-linejoin="round">
